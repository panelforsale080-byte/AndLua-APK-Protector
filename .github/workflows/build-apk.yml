name: Build AndLua Protector APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :runtime-stub:assembleRelease :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndLua-Protector-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="AndLua-Protector-1.0.0.apk"
          cp "$APK" "/tmp/${NAME}"
          gh release delete "v1.0.0" -y 2>/dev/null || true
          gh release create "v1.0.0" \
            --title "AndLua Protector v1.0.0" \
            --notes "Android app: pick an AndLua APK, AES-256-GCM wrap assets/*.lua (inner AndLua encryption kept), inject runtime decrypt gate, auto-sign. Built by GitHub Actions." \
            "/tmp/${NAME}#${NAME}"
